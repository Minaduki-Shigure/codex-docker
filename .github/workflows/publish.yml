name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/minaduki-shigure/codex-docker

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/smoke-test.sh scripts/scan.sh
      - run: docker compose --env-file /dev/null config --quiet

  resolve:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_image: ${{ steps.inputs.outputs.base_image }}
      codex_version: ${{ steps.inputs.outputs.codex_version }}
      build_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream.py resolve
      - id: date
        run: printf 'value=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-inputs
          path: dist/build-inputs.json
          if-no-files-found: error
          retention-days: 90

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-inputs
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify and extract official package
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/upstream.py fetch --arch "$ARCH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish candidate with SBOM and provenance
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.resolve.outputs.base_image }}
            CODEX_VERSION=${{ needs.resolve.outputs.codex_version }}
            BUILD_DATE=${{ needs.resolve.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=codex-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=codex-${{ matrix.arch }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Test the exact published candidate
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.resolve.outputs.codex_version }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          bash scripts/smoke-test.sh "$IMAGE@$DIGEST" "$VERSION"
      - name: Generate vulnerability report
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: bash scripts/scan.sh "$IMAGE@$DIGEST"
      - name: Record tested digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: printf '%s\n' "$DIGEST" > "dist/digest-$ARCH.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-${{ matrix.arch }}
          path: |
            dist/digest-*.txt
            dist/vulnerabilities.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tested-*
          path: tested
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble tested architectures
        id: release
        env:
          VERSION: ${{ needs.resolve.outputs.codex_version }}
        run: |
          set -euo pipefail
          amd64=$(cat tested/tested-amd64/digest-amd64.txt)
          arm64=$(cat tested/tested-arm64/digest-arm64.txt)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag="$VERSION-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\ntag=%s\n' "$digest" "$tag" >> "$GITHUB_OUTPUT"
      - name: Attest multi-platform image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true
      - name: Promote only after both architectures pass
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.codex_version }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          printf '### Published\n\n- `%s:%s`\n- `%s@%s`\n' "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
