version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /translation-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      translation-runtime:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /translation-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
